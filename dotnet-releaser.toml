# configuration file for dotnet-releaser
# Disable default packs - It will only publish NuGet and the Changelog
profile = "custom"
[msbuild]
project = "BB84.Extensions.slnx"
[github]
user = "BoBoBaSs84"
repo = "BB84.Extensions"
version_prefix = "v"
# The job name promises "Build, Test & Publish", and the release path is the last chance to catch a
# regression before it reaches nuget.org.
[test]
enable = true
[nuget]
publish = true
source = "https://api.nuget.org/v3/index.json"
publish_draft = true
